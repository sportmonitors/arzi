name = "arzi"
main = ".open-next/worker.js"
compatibility_date = "2025-10-19"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "arzi"

[[d1_databases]]
binding = "DB"
database_name = "arzi-time-db"
database_id = "9615c717-c928-4e9a-b677-f2310b0acbc7"
migrations_dir = "migrations"
# Uncomment to use production D1 from `next dev` (needs stable CF API access):
# remote = true

[images]
binding = "IMAGES"
